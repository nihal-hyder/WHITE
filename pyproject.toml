[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "white-scanner"
dynamic = ["version"]
description = "WHITE - evidence-based website security assessment tool (CLI and web GUI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WHITE contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<0.29",
    "httpcore>=1.0.5,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.7",
    "jinja2>=3.1.4,<4.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.2,<6.0",
    "cryptography>=42",
    "dnspython>=2.6,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
white = "white.cli.main:app"

[tool.setuptools.dynamic]
version = { attr = "white.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
white = ["web/templates/*.html", "web/templates/**/*.html", "web/static/**/*", "reporting/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:reportlab.*", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "B008", "S311", "E501", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "S113"]
