{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="narrow panel">
  <h1>Create your account</h1>
  <p class="muted">Your scans and reports are private to your account.</p>
  {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/signup" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <div class="field"><label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required value="{{ email }}"></div>
    <div class="field"><label for="password">Password <span class="hint">At least 8 characters.</span></label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="field"><label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></div>
    <button class="btn btn-block" type="submit">Create account</button>
  </form>
  <p class="small mt-24">Already have an account? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
