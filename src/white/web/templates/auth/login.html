{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="narrow panel">
  <h1>Sign in</h1>
  <p class="muted">Use the email address and password for your WHITE account.</p>
  {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required value="{{ email }}"></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-block" type="submit">Sign in</button>
  </form>
  {% if unconfirmed %}
  <form method="post" action="/resend-confirmation" class="mt-12">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <input type="hidden" name="email" value="{{ email }}">
    <button class="btn-link" type="submit">Resend the confirmation email</button>
  </form>
  {% endif %}
  <p class="small mt-24"><a href="/forgot-password">Forgot your password?</a> · No account yet? <a href="/signup">Create one</a></p>
</div>
{% endblock %}
