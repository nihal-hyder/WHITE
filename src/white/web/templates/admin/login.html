<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="csrf-token" content="{{ csrf_token(request) }}">
  <title>Operator console — WHITE</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <link rel="icon" href="{{ url_for('static', path='img/favicon.svg') }}" type="image/svg+xml">
</head>
<body class="admin-body">
  <main class="admin-auth">
    <div class="panel narrow">
      <div class="admin-brand">WH<span class="i">I</span>TE <span class="admin-tag">Operator console</span></div>
      <h1>Sign in</h1>
      <p class="muted small">This area is for the WHITE operator. It is separate from user accounts.</p>
      {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/admin/login" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <div class="field"><label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-block" type="submit">Enter console</button>
      </form>
      <p class="small mt-24"><a href="/">← Back to WHITE</a></p>
    </div>
  </main>
</body>
</html>
