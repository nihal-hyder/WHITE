{% extends "base.html" %}
{% block title %}Error {{ status }}{% endblock %}
{% block content %}
<div class="medium panel">
  <h1>{% if status == 404 %}Not found{% elif status == 403 %}Not allowed{% elif status == 429 %}Too many requests{% else %}Something went wrong{% endif %}</h1>
  <p>{{ message }}</p>
  <p class="actions"><a class="btn btn-secondary" href="/dashboard">Go to dashboard</a></p>
</div>
{% endblock %}
